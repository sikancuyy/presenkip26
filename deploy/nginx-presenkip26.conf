# Nginx Virtual Host Configuration
# Subdomain: presenkip26.sikancuyy.my.id
# Lokasi: /etc/nginx/sites-available/presenkip26.sikancuyy.my.id

server {
    listen 80;
    listen [::]:80;
    server_name presenkip26.sikancuyy.my.id;

    # Document Root
    root /var/www/presenkip26;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Keamanan & Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Untuk SSL (Certbot Let's Encrypt):
# sudo certbot --nginx -d presenkip26.sikancuyy.my.id
