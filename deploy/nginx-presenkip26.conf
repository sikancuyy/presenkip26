# Nginx Virtual Host Configuration
# Subdomain: presensi2026.kippnl.my.id
# Lokasi: /etc/nginx/sites-available/presensi2026.kippnl.my.id

server {
    listen 80;
    listen [::]:80;
    server_name presensi2026.kippnl.my.id;

    # Document Root
    root /var/www/presensi_kip26;
    index index.html index.php index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP-FPM Handler (Sesuaikan versi PHP, misal: php8.1-fpm / php8.2-fpm / php8.3-fpm)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Keamanan & Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Untuk SSL (Certbot Let's Encrypt):
# sudo certbot --nginx -d presensi2026.kippnl.my.id
