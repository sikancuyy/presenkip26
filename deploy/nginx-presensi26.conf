# Nginx Virtual Host Configuration
# Subdomain: presensi26.kippnl.my.id
# Lokasi: /etc/nginx/sites-available/presensi26.kippnl.my.id

server {
    listen 80;
    listen [::]:80;
    server_name presensi26.kippnl.my.id;

    # Document Root
    root /var/www/presenkip26;
    index index.html index.php index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pass PHP scripts to FastCGI server
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Protect internal data directory from direct browser downloads
    location ^~ /data/ {
        deny all;
        return 403;
    }

    # Prevent stale browser caching on JS and CSS
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static images and fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Keamanan & Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

