<style>
/* ==========================================================================
   PEMILWA PNL Modern Minimalist Dashboard - Presensi Panitia KIP 2026
   Visual Identity: White Dominant, Red (#DC2626) & Gold (#F59E0B) Accents
   ========================================================================== */

:root {
  --color-canvas: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F1F5F9;
  
  /* PEMILWA PNL Brand Palette */
  --pnl-red: #DC2626;
  --pnl-red-hover: #B91C1C;
  --pnl-red-light: #FEF2F2;
  --pnl-red-border: #FECACA;
  
  --pnl-gold: #F59E0B;
  --pnl-gold-hover: #D97706;
  --pnl-gold-light: #FFFBEB;
  --pnl-gold-border: #FDE68A;

  --pnl-black: #0F172A;
  --pnl-slate: #1E293B;
  --pnl-slate-muted: #475569;
  --pnl-slate-subtle: #64748B;
  --pnl-border: #E2E8F0;
  --pnl-border-subtle: #F1F5F9;

  --pnl-emerald: #059669;
  --pnl-emerald-light: #ECFDF5;
  --pnl-emerald-border: #A7F3D0;
}

/* Base Body Surface */
body {
  background-color: var(--color-canvas);
  color: var(--pnl-slate);
}

/* Card Styling (Clean Minimalist with Soft Shadow) */
.dash-card {
  background-color: var(--color-surface);
  border: 1px solid var(--pnl-border);
  border-radius: 1.25rem;
  box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.dash-card:hover {
  box-shadow: 0 8px 25px -4px rgba(15, 23, 42, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
}

.dash-card-elevated {
  background-color: var(--color-surface);
  border: 1px solid var(--pnl-border);
  border-radius: 1.5rem;
  box-shadow: 0 10px 30px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
}

/* Agenda Banner Card (High-Impact Hero Card) */
.dash-card-agenda {
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
  border: 1px solid #334155;
  border-radius: 1.5rem;
  box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
}

.dash-card-agenda::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #DC2626 0%, #F59E0B 100%);
}

/* Form Inputs */
.dash-input {
  background-color: #FFFFFF;
  border: 1.5px solid var(--pnl-border);
  border-radius: 0.875rem;
  color: var(--pnl-black);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.dash-input:focus {
  outline: none;
  border-color: var(--pnl-red);
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
}

/* Buttons */
.btn-pnl-red {
  background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
  color: #FFFFFF;
  font-weight: 700;
  border-radius: 0.875rem;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.28);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-pnl-red:hover {
  background: linear-gradient(135deg, #B91C1C 0%, #991B1B 100%);
  box-shadow: 0 6px 18px rgba(220, 38, 38, 0.38);
  transform: translateY(-1px);
}

.btn-pnl-red:active {
  transform: translateY(1px);
}

.btn-pnl-gold {
  background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  color: #FFFFFF;
  font-weight: 700;
  border-radius: 0.875rem;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-pnl-gold:hover {
  background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
  box-shadow: 0 6px 18px rgba(245, 158, 11, 0.38);
  transform: translateY(-1px);
}

.btn-pnl-gold:active {
  transform: translateY(1px);
}

.btn-pnl-outline {
  background-color: #FFFFFF;
  color: var(--pnl-slate);
  border: 1.5px solid var(--pnl-border);
  font-weight: 600;
  border-radius: 0.875rem;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-pnl-outline:hover {
  background-color: var(--color-surface-hover);
  border-color: #CBD5E1;
  color: var(--pnl-black);
}

/* Badges & Status Pills */
.badge-pnl-red {
  background-color: var(--pnl-red-light);
  color: var(--pnl-red);
  border: 1px solid var(--pnl-red-border);
  border-radius: 9999px;
  font-weight: 700;
}

.badge-pnl-gold {
  background-color: var(--pnl-gold-light);
  color: #92400E;
  border: 1px solid var(--pnl-gold-border);
  border-radius: 9999px;
  font-weight: 700;
}

.badge-pnl-emerald {
  background-color: var(--pnl-emerald-light);
  color: var(--pnl-emerald);
  border: 1px solid var(--pnl-emerald-border);
  border-radius: 9999px;
  font-weight: 700;
}

.badge-pnl-slate {
  background-color: #F1F5F9;
  color: #475569;
  border: 1px solid #E2E8F0;
  border-radius: 9999px;
  font-weight: 600;
}

/* Nav Tabs Segmented Controller */
.pnl-nav-container {
  background-color: #F1F5F9;
  border-radius: 0.875rem;
  padding: 0.25rem;
  display: inline-flex;
  border: 1px solid #E2E8F0;
}

.pnl-nav-item-active {
  background-color: #FFFFFF;
  color: var(--pnl-red);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
  border-radius: 0.625rem;
  font-weight: 700;
}

.pnl-nav-item-idle {
  color: var(--pnl-slate-muted);
  background-color: transparent;
  border-radius: 0.625rem;
  font-weight: 600;
}

.pnl-nav-item-idle:hover {
  color: var(--pnl-black);
}

/* Sidebar Dock (Quixotic Style) */
.sidebar-dock {
  background-color: #FFFFFF;
  border: 1px solid var(--pnl-border);
  border-radius: 1.5rem;
  box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
}

.sidebar-icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 0.875rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748B;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-icon-btn:hover {
  background-color: #F1F5F9;
  color: var(--pnl-red);
}

.sidebar-icon-btn.active {
  background-color: var(--pnl-red);
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
}

/* Pulsing Live Indicator */
@keyframes pnlPulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.4;
    transform: scale(0.92);
  }
}

.indicator-pulse {
  animation: pnlPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

/* Accessibility affordances */
a[href],
button,
select,
label[for],
input[type="checkbox"],
input[type="radio"] {
  cursor: pointer;
}

button:disabled,
input:disabled,
select:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

:focus-visible {
  outline: 2px solid var(--pnl-red);
  outline-offset: 2px;
}

/* Custom crisp scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #F8FAFC;
}
::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94A3B8;
}

/* Number input spin buttons reset */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type="number"] {
  -moz-appearance: textfield;
}

/* Smooth motion with user reduction fallback */
.transition-smooth {
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  *,
  ::before,
  ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
