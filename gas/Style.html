<style>
  /* Editorial Minimalist Theme: Warm Sand & Emerald Accent - Presensi Panitia KIP 2026 */

  :root {
    --color-canvas: #FAF7F2;
    --color-canvas-alt: #F4EDE2;
    --color-surface: #FFFFFF;
    --color-surface-warm: #FAF6EF;
    --color-ink: #191817;
    --color-ink-muted: #524E48;
    --color-ink-subtle: #7A746B;
    --color-border: #E8E0D2;
    --color-border-subtle: #F0EAE0;
    --color-accent-emerald: #047857;
    --color-accent-hover: #065F46;
    --color-accent-pill: #10B981;
  }

  /* Accessibility Affordances */
  a[href],
  button,
  select,
  label[for],
  input[type="checkbox"],
  input[type="radio"] {
    cursor: pointer;
  }

  button:disabled,
  input:disabled,
  select:disabled {
    cursor: not-allowed;
  }

  /* High Contrast Keyboard Focus Visibility (WCAG AA) */
  :focus-visible {
    outline: 2px solid var(--color-ink);
    outline-offset: 2px;
  }

  /* Custom Warm Scrollbar */
  ::-webkit-scrollbar {
    width: 7px;
    height: 7px;
  }
  ::-webkit-scrollbar-track {
    background: #F4EDE2;
  }
  ::-webkit-scrollbar-thumb {
    background: #D9CEBE;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #C4B5A0;
  }

  /* Editorial Card & Pill Styling */
  .editorial-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 1.5rem;
    box-shadow: 0 1px 3px rgba(35, 30, 25, 0.04), 0 8px 24px -6px rgba(35, 30, 25, 0.05);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .editorial-card-warm {
    background: var(--color-surface-warm);
    border: 1px solid var(--color-border);
    border-radius: 1.5rem;
  }

  .pill-btn {
    border-radius: 9999px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pill-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px -2px rgba(25, 24, 23, 0.12);
  }
  .pill-btn:active {
    transform: scale(0.97);
  }

  .pill-emerald {
    background-color: var(--color-accent-emerald);
    color: #FFFFFF;
  }
  .pill-emerald:hover {
    background-color: var(--color-accent-hover);
  }

  /* Animation Keyframes */
  @keyframes shimmerBar {
    0% {
      transform: translateX(-100%);
    }
    50% {
      transform: translateX(0%);
    }
    100% {
      transform: translateX(100%);
    }
  }
  .animate-shimmer-bar {
    animation: shimmerBar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes modalSpring {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .animate-modal-spring {
    animation: modalSpring 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes pulseLive {
    0%, 100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.6;
      transform: scale(1.15);
    }
  }
  .animate-pulse-live {
    animation: pulseLive 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  /* Spinner Smooth */
  @keyframes spinSmooth {
    to {
      transform: rotate(360deg);
    }
  }
  .animate-spin-smooth {
    animation: spinSmooth 0.8s linear infinite;
  }

  /* Accessibility: Respect Reduced Motion Preference */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    #appPreloader {
      display: none !important;
    }
    .pill-btn:hover {
      transform: none !important;
    }
  }

  /* Print Optimization */
  @media print {
    body {
      background: #FFFFFF !important;
      color: #000000 !important;
    }
    header,
    nav,
    #agendaCard,
    #toastContainer,
    #appPreloader,
    .no-print {
      display: none !important;
    }
    #adminPanel {
      display: block !important;
    }
    .card-base,
    .editorial-card {
      border: none !important;
      box-shadow: none !important;
    }
  }
</style>
